# Local development convenience. Railway runs the two services separately.
services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      CORS_ORIGINS: "*"

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
