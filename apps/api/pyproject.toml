[project]
name = "avantage-api"
version = "0.1.0"
description = "AVantage — autonomous fleet revenue intelligence API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]
# Optimization + data stack, added when Phases 2–5 land.
opt = [
    "ortools>=9.11.0",
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
]
db = [
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
